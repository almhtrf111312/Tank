name: LAN recovery debug APK
on:
  push:
    branches: ['fix/lan-recovery-spectators-v2']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lan-debug-${{ github.ref }}
  cancel-in-progress: true
jobs:
  debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TANK_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JVM transport, terrain and recovery tests
        run: |
          set -euo pipefail
          bash tests/run.sh | tee native-test-results.txt
      - name: Game regression and lossy ten-minute simulation
        run: |
          set -euo pipefail
          npm ci --prefix tests --ignore-scripts
          python3 tests/run-game.py | tee game-test-results.txt
          TANK_FAKE_CLOCK=1 TANK_GAME_TEST=lan-recovery.cjs python3 tests/run-game.py | tee recovery-test-results.txt
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Restore signing identity for upgrade-compatible debug build
        env:
          KEYSTORE_BASE64: ${{ secrets.TANK_KEYSTORE_BASE64 }}
        run: |
          umask 077
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tank-debug.jks"
      - name: Build debug APK and lint
        env:
          TANK_KEYSTORE_PATH: ${{ runner.temp }}/tank-debug.jks
          TANK_KEYSTORE_PASSWORD: ${{ secrets.TANK_KEYSTORE_PASSWORD }}
          TANK_KEY_ALIAS: ${{ secrets.TANK_KEY_ALIAS }}
          TANK_KEY_PASSWORD: ${{ secrets.TANK_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - name: Verify and package debug APK
        run: |
          mkdir -p deliverables
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" > signature.txt
          grep -q 'certificate SHA-256 digest: 5fe6429665cafb6a9594cfd6d77d84c672ee2bc44ae9c5d2b3f5fd3ad65c075c' signature.txt
          cp "$APK" "deliverables/tank-lan-debug-1.2.0.$GITHUB_RUN_NUMBER.apk"
          cp *test-results.txt signature.txt deliverables/
      - uses: actions/upload-artifact@v4
        with:
          name: tank-lan-debug
          path: deliverables/*
          if-no-files-found: error
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/tank-debug.jks"
