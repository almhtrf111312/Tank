name: Build Tank Multiplayer APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TANK_BUILD_NUMBER: ${{ github.run_number }}
      HAS_SIGNING: ${{ secrets.TANK_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Test native room server
        run: bash tests/run.sh
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Restore signing identity
        if: env.HAS_SIGNING == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.TANK_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing TANK_KEYSTORE_BASE64 repository secret"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tank-release.jks"
      - name: Build signed APK
        if: env.HAS_SIGNING == 'true'
        env:
          TANK_KEYSTORE_PATH: ${{ runner.temp }}/tank-release.jks
          TANK_KEYSTORE_PASSWORD: ${{ secrets.TANK_KEYSTORE_PASSWORD }}
          TANK_KEY_ALIAS: ${{ secrets.TANK_KEY_ALIAS }}
          TANK_KEY_PASSWORD: ${{ secrets.TANK_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease :app:lintRelease
      - name: Compile APK and lint without signing credentials
        if: env.HAS_SIGNING != 'true'
        run: gradle --no-daemon :app:assembleRelease :app:lintRelease
      - name: Package APK and source
        run: |
          VERSION=$(sed -n "s/.*baseVersion = '\([^']*\)'.*/\1/p" app/build.gradle)
          VERSION="$VERSION.$GITHUB_RUN_NUMBER"
          mkdir -p deliverables
          if test -f app/build/outputs/apk/release/app-release.apk; then
            cp app/build/outputs/apk/release/app-release.apk "deliverables/tank-multiplayer-$VERSION.apk"
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk "deliverables/tank-multiplayer-$VERSION-unsigned.apk"
            cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" deliverables/
          fi
          git archive --format=zip --output="deliverables/tank-source-$VERSION.zip" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: tank-android
          path: deliverables/*
          if-no-files-found: error
