name: Build Tank Multiplayer APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TANK_BUILD_NUMBER: ${{ github.run_number }}
      HAS_SIGNING: ${{ secrets.TANK_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Test native room server
        run: bash tests/run.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test four simulated clients and game physics
        run: |
          npm ci --prefix tests --ignore-scripts
          python3 tests/run-game.py
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Restore signing identity
        env:
          KEYSTORE_BASE64: ${{ secrets.TANK_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing TANK_KEYSTORE_BASE64 repository secret"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tank-release.jks"
      - name: Build signed APK
        env:
          TANK_KEYSTORE_PATH: ${{ runner.temp }}/tank-release.jks
          TANK_KEYSTORE_PASSWORD: ${{ secrets.TANK_KEYSTORE_PASSWORD }}
          TANK_KEY_ALIAS: ${{ secrets.TANK_KEY_ALIAS }}
          TANK_KEY_PASSWORD: ${{ secrets.TANK_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease :app:lintRelease
      - name: Package APK and source
        run: |
          VERSION=$(sed -n "s/.*baseVersion = '\([^']*\)'.*/\1/p" app/build.gradle)
          VERSION="$VERSION.$GITHUB_RUN_NUMBER"
          mkdir -p deliverables
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/tank-signature.txt"
          grep -q 'certificate SHA-256 digest: 5fe6429665cafb6a9594cfd6d77d84c672ee2bc44ae9c5d2b3f5fd3ad65c075c' "$RUNNER_TEMP/tank-signature.txt"
          cp "$APK" "deliverables/tank-multiplayer-$VERSION.apk"
          git archive --format=zip --output="deliverables/tank-source-$VERSION.zip" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: tank-android
          path: deliverables/*
          if-no-files-found: error
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/tank-release.jks"
